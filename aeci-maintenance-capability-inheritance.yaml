cross_domain_rules:
  - id: RULE-001
    text: Safety prerequisites precede hazardous execution.
  - id: RULE-002
    text: RBAC permission does not equal technical competence or authorization.
  - id: RULE-003
    text: Released work packs pin controlled revisions and never silently mutate safety-critical content.
  - id: RULE-004
    text: Work execution completion does not equal successful verified repair.
  - id: RULE-005
    text: Repeat failures and rework remain explicitly linked to prior work.
  - id: RULE-006
    text: Rework requires adjudication before individual performance attribution.
  - id: RULE-007
    text: Technician KPIs are context and difficulty aware and must not reward unsafe speed.
  - id: RULE-008
    text: Controlled tools and instruments carry custody, inspection and calibration status.
  - id: RULE-009
    text: Inventory is movement-ledger based.
  - id: RULE-010
    text: Offline evidence is first class and retries are idempotent.
  - id: RULE-011
    text: AI is advisory and cannot override physical, legal or safety authority.
  - id: RULE-012
    text: Acknowledging a handover or alert never silently closes the underlying operational object.
  - id: RULE-013
    text: Field learning proposes controlled changes but cannot directly modify approved procedures.

acceptance_sources:
  - AECI_Maintenance_Acceptance_Test_Catalog_v1.md
  - AECI_Maintenance_Operational_Workflow_Acceptance_Addendum_v1.md

required_golden_flows:
  - planned_hazardous_mmu_repair
  - breakdown_followed_by_rework
  - recurring_pump_failure
  - out_of_tolerance_instrument
  - shift_crossing_with_active_isolation
