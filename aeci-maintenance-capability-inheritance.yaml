schema_version: 1
pack: aeci-maintenance
inheritance_policy:
  source: DDE_Maintenance_Intelligence_ERP_Master_Plan_v2.md
  default: inherit_all_applicable
  silence_is_exclusion: false
  exclusion_requires:
    - source_capability
    - rationale
    - safety_compliance_impact
    - owner
    - approval
    - review_date
  protected_domains:
    - safety
    - legal_compliance
    - evidence
    - competency
    - maintenance_quality
    - auditability

operating_loop:
  - sense
  - understand
  - assess_risk
  - predict
  - plan
  - resource
  - make_safe
  - execute
  - verify
  - measure_outcome
  - learn
  - optimise

